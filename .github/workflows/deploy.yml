name: CI/CD SmartContainer_AI

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mansourimed25/smartcontainer-ai:latest

      - name: Deploy on VPS via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 37.60.246.169 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@37.60.246.169 "
            # Sync code source dans stage-med/
            if [ -d /root/stage-med/.git ]; then
              cd /root/stage-med && git pull origin main
            else
              git clone https://github.com/medMansouri25/ProjetContainer_AI.git /root/stage-med
            fi

            # Redeploy Docker container
            docker pull mansourimed25/smartcontainer-ai:latest
            docker stop smartcontainer || true
            docker rm smartcontainer || true
            docker run -d \
              --name smartcontainer \
              --restart unless-stopped \
              -p 5001:5000 \
              mansourimed25/smartcontainer-ai:latest
          "
