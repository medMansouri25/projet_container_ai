name: CI/CD SmartContainer_AI

on:
  push:
    branches: [ main ]
    paths-ignore:
      # le front est heberge sur Vercel et api_base.txt est mis a jour
      # automatiquement par le VPS : pas besoin de rebuild Docker
      - 'frontend/**'
      - 'api_base.txt'
      - '**.md'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mansourimed25/smartcontainer-ai:latest

      - name: Deploy on VPS via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 37.60.246.169 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@37.60.246.169 "
            set -e   # tout echec (pull disque plein, run...) fait echouer la CI

            # Sync code source dans stage-med/
            if [ -d /root/stage-med/.git ]; then
              cd /root/stage-med && git pull origin main
            else
              git clone https://github.com/medMansouri25/ProjetContainer_AI.git /root/stage-med
            fi

            # Purger les anciennes images AVANT le pull (l'image fait ~5 Go,
            # les versions accumulees saturent le disque -> pull silencieusement
            # echoue et le conteneur repart sur l'ancienne image)
            docker image prune -af

            # Redeploy Docker container
            docker pull mansourimed25/smartcontainer-ai:latest
            docker rm -f smartcontainer || true
            # docker rm est asynchrone : attendre la fin effective de la suppression
            while docker inspect smartcontainer >/dev/null 2>&1; do sleep 1; done
            docker run -d \
              --name smartcontainer \
              --restart unless-stopped \
              -p 5001:5000 \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              mansourimed25/smartcontainer-ai:latest

            # Verification : l'API doit repondre (echec CI sinon)
            sleep 10
            for i in \$(seq 1 12); do
              if curl -sf http://localhost:5001/api/dashboard >/dev/null; then
                echo 'API OK' && exit 0
              fi
              sleep 10
            done
            echo 'API ne repond pas apres deploiement' && exit 1
          "
