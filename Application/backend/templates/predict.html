<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOLO — Prédiction</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; color: #222; }

    header {
      background: #1a1a2e; color: #fff;
      padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.2rem; }
    header a { color: #a0c4ff; text-decoration: none; font-size: .9rem; }
    header a:hover { text-decoration: underline; }

    .container { max-width: 1000px; margin: 28px auto; padding: 0 16px; }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2px dashed #a0c4ff; border-radius: 8px;
      padding: 28px; text-align: center;
      background: #f0f6ff; cursor: pointer; margin-bottom: 20px;
      transition: background .2s;
    }
    .upload-zone:hover { background: #dceeff; }
    .upload-zone p { color: #555; margin-bottom: 10px; }
    #file-input { display: none; }

    .btn {
      padding: 9px 20px; border: none; border-radius: 6px;
      font-size: .95rem; cursor: pointer; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn:disabled { background: #bbb; cursor: default; }

    /* ── Layout résultat ── */
    .result-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 700px) {
      .result-layout { grid-template-columns: 1fr; }
    }

    /* ── Canvas ── */
    .canvas-wrap {
      background: #fff; border-radius: 8px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      display: flex; align-items: center; justify-content: center;
      min-height: 300px;
    }
    canvas {
      max-width: 100%; display: block;
    }
    .canvas-placeholder {
      color: #bbb; font-size: 1rem; padding: 40px; text-align: center;
    }

    /* ── Détections ── */
    .detections-panel {
      background: #fff; border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      padding: 16px;
    }
    .detections-panel h3 {
      font-size: 1rem; margin-bottom: 12px; color: #333;
      border-bottom: 1px solid #eee; padding-bottom: 8px;
    }
    #detections { list-style: none; }
    #detections li {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 4px; border-bottom: 1px solid #f0f0f0;
      font-size: .9rem;
    }
    #detections li:last-child { border-bottom: none; }
    .det-label { font-weight: bold; color: #1a1a2e; }
    .det-conf {
      font-size: .8rem; padding: 2px 8px; border-radius: 10px;
      background: #e8f5e9; color: #2e7d32; font-weight: bold;
    }
    .det-bbox { font-size: .75rem; color: #999; }
    #detections-empty { color: #bbb; font-size: .9rem; text-align: center; padding: 20px 0; }

    /* ── Spinner ── */
    .spinner {
      display: none; text-align: center; padding: 20px; color: #888;
    }
    .spinner::after {
      content: ""; display: inline-block;
      width: 20px; height: 20px; border: 3px solid #ddd;
      border-top-color: #1a73e8; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Erreur ── */
    #error-msg {
      display: none; background: #f8d7da; color: #721c24;
      border-radius: 6px; padding: 10px 14px; margin-bottom: 16px;
      font-size: .9rem;
    }
  </style>
</head>
<body>

<header>
  <h1>🎯 YOLO — Prédiction</h1>
  <a href="/">← Retour à la Galerie</a>
</header>

<div class="container">

  <!-- Upload -->
  <div class="upload-zone" id="upload-zone">
    <p>Importez une image pour détecter les objets</p>
    <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
      Choisir une image
    </button>
    <input type="file" id="file-input" accept="image/*" />
  </div>

  <!-- Erreur -->
  <div id="error-msg"></div>

  <!-- Spinner -->
  <div class="spinner" id="spinner"></div>

  <!-- Résultat -->
  <div class="result-layout">

    <!-- Canvas -->
    <div class="canvas-wrap" id="canvas-wrap">
      <div class="canvas-placeholder" id="canvas-placeholder">
        L'image avec les détections apparaîtra ici
      </div>
      <canvas id="result-canvas" style="display:none;"></canvas>
    </div>

    <!-- Panneau détections -->
    <div class="detections-panel">
      <h3>Objets détectés</h3>
      <p id="detections-empty">Aucune détection pour l'instant.</p>
      <ul id="detections"></ul>
    </div>

  </div>
</div>

<script>
  const COLORS = [
    '#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6',
    '#1abc9c','#e67e22','#34495e','#e91e63','#00bcd4',
  ];

  document.getElementById('file-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await runPredict(file);
  });

  // Drag & drop sur la zone upload
  const zone = document.getElementById('upload-zone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.background = '#dceeff'; });
  zone.addEventListener('dragleave', () => { zone.style.background = ''; });
  zone.addEventListener('drop', async e => {
    e.preventDefault(); zone.style.background = '';
    const file = e.dataTransfer.files[0];
    if (file) await runPredict(file);
  });

  async function runPredict(file) {
    showError('');
    showSpinner(true);
    clearCanvas();
    clearDetections();

    const fd = new FormData();
    fd.append('file', file);

    try {
      const resp = await fetch('/predict', { method: 'POST', body: fd });
      const data = await resp.json();

      if (!resp.ok) {
        showError(data.error || 'Erreur lors de la prédiction.');
        showSpinner(false);
        return;
      }

      const img = new Image();
      img.onload = () => drawResults(img, data.detections);
      img.src = URL.createObjectURL(file);
    } catch (err) {
      showError('Erreur réseau : ' + err.message);
    } finally {
      showSpinner(false);
    }
  }

  function drawResults(img, detections) {
    const canvas = document.getElementById('result-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img, 0, 0);

    detections.forEach((det, i) => {
      const color = COLORS[i % COLORS.length];
      const [x1, y1, x2, y2] = det.bbox;
      const label = `${det.label} ${(det.confidence * 100).toFixed(0)}%`;

      // Boîte
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(2, Math.round(img.width / 300));
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

      // Fond du label
      ctx.font = `bold ${Math.max(12, Math.round(img.width / 50))}px Arial`;
      const textW = ctx.measureText(label).width + 8;
      const textH = parseInt(ctx.font) + 6;
      ctx.fillStyle = color;
      ctx.fillRect(x1, y1 - textH, textW, textH);

      // Texte
      ctx.fillStyle = '#fff';
      ctx.fillText(label, x1 + 4, y1 - 4);
    });

    document.getElementById('canvas-placeholder').style.display = 'none';
    canvas.style.display = 'block';

    renderDetectionsList(detections);
  }

  function renderDetectionsList(detections) {
    const list = document.getElementById('detections');
    const empty = document.getElementById('detections-empty');
    list.innerHTML = '';

    if (!detections.length) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    detections.forEach((det, i) => {
      const color = COLORS[i % COLORS.length];
      const li = document.createElement('li');
      li.innerHTML = `
        <div>
          <span class="det-label" style="color:${color}">${det.label}</span><br/>
          <span class="det-bbox">bbox [${det.bbox.join(', ')}]</span>
        </div>
        <span class="det-conf">${(det.confidence * 100).toFixed(1)}%</span>
      `;
      list.appendChild(li);
    });
  }

  function clearCanvas() {
    const canvas = document.getElementById('result-canvas');
    canvas.style.display = 'none';
    document.getElementById('canvas-placeholder').style.display = 'block';
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function clearDetections() {
    document.getElementById('detections').innerHTML = '';
    document.getElementById('detections-empty').style.display = 'block';
  }

  function showSpinner(on) {
    document.getElementById('spinner').style.display = on ? 'block' : 'none';
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }
</script>

</body>
</html>
