<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartContainer AI — Scanner BIC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav>
    <span class="brand">
      <svg class="icon icon-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12.5V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v6.5"/><path d="M10 6v4"/><path d="M14 6v4"/><path d="M2 12.5h20l-1.5 6a2 2 0 0 1-2 1.5h-13a2 2 0 0 1-2-1.5z"/></svg>
      SmartContainer AI
    </span>
    <a href="/">Scanner</a>
    <a href="/history">Historique</a>
    <a href="/dashboard">Dashboard</a>
  </nav>

  <main>
    <h1>Scanner un conteneur</h1>
    <p class="subtitle">Détection du code BIC (ISO 6346) — importez une image ou utilisez la caméra.</p>

    {% if error %}<div class="alert">{{ error }}</div>{% endif %}

    <form id="scan-form" action="/scan" method="post" enctype="multipart/form-data">
      <div id="dropzone" class="dropzone">
        <svg class="icon icon-large" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        <p>Glissez une image ici<br>ou</p>
        <label class="btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Choisir un fichier
          <input type="file" id="file-input" name="image" accept="image/*" hidden>
        </label>
        <button type="button" id="camera-btn" class="btn btn-secondary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          Ouvrir la caméra
        </button>
      </div>

      <div id="camera-zone" class="camera-zone" hidden>
        <video id="video" autoplay playsinline></video>
        <div class="camera-actions">
          <button type="button" id="capture-btn" class="btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
            Capturer
          </button>
          <button type="button" id="close-camera-btn" class="btn btn-secondary">Fermer</button>
        </div>
        <canvas id="canvas" hidden></canvas>
      </div>

      <div id="preview-zone" class="preview-zone" hidden>
        <img id="preview" alt="aperçu">
        <div class="camera-actions">
          <button type="submit" class="btn btn-primary">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
            Analyser
          </button>
          <button type="button" id="reset-btn" class="btn btn-secondary">Changer d'image</button>
        </div>
      </div>
    </form>
  </main>

  <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
</body>
</html>
