<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartContainer AI — Scanner BIC</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/i18n.js"></script>
</head>
<body>
  <nav>
    <span class="brand">
      <svg class="icon icon-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12.5V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v6.5"/><path d="M10 6v4"/><path d="M14 6v4"/><path d="M2 12.5h20l-1.5 6a2 2 0 0 1-2 1.5h-13a2 2 0 0 1-2-1.5z"/></svg>
      SmartContainer AI
    </span>
    <a href="index.html" data-i18n="nav.scan">Scanner BIC</a>
    <a href="capture.html" data-i18n="nav.capture">Capture passage</a>
    <a href="history.html" data-i18n="nav.history">Historique</a>
    <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
    <select id="lang-select" class="lang-select" aria-label="Langue / اللغة">
      <option value="fr">FR</option>
      <option value="ar">ع</option>
    </select>
  </nav>

  <main>
    <h1 data-i18n="scan.title">Scanner un conteneur</h1>
    <p class="subtitle" data-i18n="scan.subtitle">Détection du code BIC (ISO 6346) — importez une image ou utilisez la caméra.</p>

    <div id="error-alert" class="alert" hidden></div>

    <section id="scanner-section">
      <div id="dropzone" class="dropzone">
        <svg class="icon icon-large" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        <p><span data-i18n="scan.drop">Glissez une image ici</span><br><span data-i18n="scan.or">ou</span></p>
        <label class="btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span data-i18n="scan.pick">Choisir un fichier</span>
          <input type="file" id="file-input" accept="image/*" hidden>
        </label>
        <button type="button" id="camera-btn" class="btn btn-secondary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          <span data-i18n="scan.camera">Ouvrir la caméra</span>
        </button>
      </div>

      <div id="camera-zone" class="camera-zone" hidden>
        <video id="video" autoplay playsinline></video>
        <div class="camera-actions">
          <button type="button" id="capture-btn" class="btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
            Capturer
          </button>
          <button type="button" id="close-camera-btn" class="btn btn-secondary">Fermer</button>
        </div>
        <canvas id="canvas" hidden></canvas>
      </div>

      <div id="preview-zone" class="preview-zone" hidden>
        <img id="preview" alt="aperçu">
        <div class="camera-actions">
          <button type="button" id="analyze-btn" class="btn btn-primary">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
            Analyser
          </button>
          <button type="button" id="reset-btn" class="btn btn-secondary">Changer d'image</button>
        </div>
        <p id="loading" class="subtitle" hidden>Analyse en cours… (premier scan : ~30 s, chargement des modèles)</p>
      </div>
    </section>

    <section id="result-section" hidden>
      <h1>Résultat de l'analyse</h1>
      <div class="result-grid">
        <div class="result-image"><img id="result-img" alt="image analysée"></div>
        <div class="result-panel">
          <div class="badges" id="result-badges"></div>
          <p class="raw" id="result-raw"></p>
          <div class="confirm-form">
            <label for="bic">Code BIC (corrigez si nécessaire)</label>
            <input type="text" id="bic" maxlength="11" pattern="[A-Za-z]{4}[0-9]{7}" placeholder="ABCD1234567">
            <div class="camera-actions">
              <button type="button" id="confirm-btn" class="btn btn-primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                Confirmer
              </button>
              <button type="button" id="reject-btn" class="btn btn-secondary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                Rejeter
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
